name: Plain language snapshot refresh
on:
  push:
    branches: [codex/plain-language-closure]
permissions:
  contents: read
jobs:
  snapshots:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_RIVET_DEMO_AUTH: "1"
      NEXT_PUBLIC_DATA_MODE: mock
      NEXT_PUBLIC_RIVET_DEPLOYMENT_CLASS: preview
      NEXT_DIST_DIR: .next-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web exec next build --webpack
      - name: Capture references and exercise preview journeys
        env:
          PLAYWRIGHT_SERVER_MODE: start
          PLAYWRIGHT_DIST_DIR: .next-playwright
          PLAYWRIGHT_WORKERS: "2"
        run: pnpm test:e2e --update-snapshots=all --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plain-language-screenshots
          path: |
            apps/web/e2e/__screenshots__/
            apps/web/test-results/
          retention-days: 3

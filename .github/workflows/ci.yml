name: GymOS CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: 11.20.0
  NODE_VERSION: 22

jobs:
  diag:
    name: Diagnose supplier dialog on Linux
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_RIVET_DEMO_AUTH: "1"
      NEXT_PUBLIC_DATA_MODE: mock
      NEXT_PUBLIC_RIVET_DEPLOYMENT_CLASS: preview
      NEXT_DIST_DIR: .next-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: date -u; echo "TZ=$TZ"
      - run: pnpm --filter web exec next build --webpack
      - name: Unfixed test repeated (expect failures)
        continue-on-error: true
        env:
          PLAYWRIGHT_SERVER_MODE: start
          PLAYWRIGHT_DIST_DIR: .next-playwright
          PLAYWRIGHT_WORKERS: "2"
        run: date -u; pnpm test:e2e zz-unfixed-pass-3.spec.ts -g "short phone viewport" --retries=0 --repeat-each=12
      - name: Fixed test repeated
        env:
          PLAYWRIGHT_SERVER_MODE: start
          PLAYWRIGHT_DIST_DIR: .next-playwright
          PLAYWRIGHT_WORKERS: "2"
        run: date -u; pnpm test:e2e workflow-pass-3.spec.ts -g "short phone viewport" --retries=0 --repeat-each=20; date -u
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag
          path: |
            apps/web/diag-out/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 3

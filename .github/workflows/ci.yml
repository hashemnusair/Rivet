name: GymOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_operational_flow:
        description: "Create and archive one disposable member while verifying the staged Convex write path"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PNPM_VERSION: 10.32.1
  NODE_VERSION: 22

jobs:
  static:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck web and Convex
        run: |
          pnpm typecheck
          pnpm convex:typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and component tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  browser:
    name: Playwright preview journeys
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run Playwright
        # Keep the parent Playwright process and the Next dev server on the
        # same deterministic preview contract. The webServer config repeats
        # these values for the child process; exporting them here also makes
        # Next's public env replacement unambiguous on GitHub-hosted runners.
        env:
          NEXT_PUBLIC_RIVET_DEMO_AUTH: "1"
          NEXT_PUBLIC_DATA_MODE: "mock"
        run: pnpm test:e2e

  convex-codegen:
    name: Convex generated code check (credential-gated)
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate and verify Convex types
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        run: pnpm convex:codegen
      - name: Ensure generated files are committed
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        run: git diff --exit-code -- apps/web/convex/_generated
      - name: Report credential-gated skip
        if: ${{ env.CONVEX_DEPLOY_KEY == '' }}
        run: echo "::notice::Convex code generation was skipped because CONVEX_DEPLOY_KEY is not configured for this repository."

  convex-clerk-smoke:
    name: Authenticated Clerk → Convex smoke
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      PLAYWRIGHT_CLERK_STORAGE_STATE_SECRET: ${{ secrets.PLAYWRIGHT_CLERK_STORAGE_STATE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Verify trusted smoke credentials
        run: |
          test -n "$CONVEX_DEPLOY_KEY" || { echo "::error::Missing CONVEX_DEPLOY_KEY"; exit 1; }
          test -n "$NEXT_PUBLIC_CONVEX_URL" || { echo "::error::Missing NEXT_PUBLIC_CONVEX_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" || { echo "::error::Missing NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"; exit 1; }
          test -n "$CLERK_SECRET_KEY" || { echo "::error::Missing CLERK_SECRET_KEY"; exit 1; }
          test -n "$PLAYWRIGHT_CLERK_STORAGE_STATE_SECRET" || { echo "::error::Missing PLAYWRIGHT_CLERK_STORAGE_STATE"; exit 1; }
      - name: Write trusted storage state outside the repository
        run: printf '%s' "$PLAYWRIGHT_CLERK_STORAGE_STATE_SECRET" > "$RUNNER_TEMP/clerk-storage-state.json"
      - name: Run authenticated smoke
        env:
          PLAYWRIGHT_CONVEX_SMOKE: "1"
          PLAYWRIGHT_CLERK_STORAGE_STATE: ${{ runner.temp }}/clerk-storage-state.json
        run: pnpm --filter web exec playwright test e2e/convex-smoke.spec.ts
      - name: Run staged operational flow
        if: ${{ inputs.run_operational_flow == true }}
        env:
          PLAYWRIGHT_CONVEX_SMOKE: "1"
          PLAYWRIGHT_CONVEX_OPERATIONAL_FLOW: "1"
          PLAYWRIGHT_CLERK_STORAGE_STATE: ${{ runner.temp }}/clerk-storage-state.json
        run: pnpm --filter web exec playwright test e2e/convex-operational-flow.spec.ts

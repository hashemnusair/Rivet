name: GymOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_operational_flow:
        description: "Create and archive one disposable member while verifying the staged Convex write path"
        required: false
        type: boolean
        default: false
      run_realtime_flow:
        description: "Run the credentialed two-browser realtime staging journey"
        required: false
        type: boolean
        default: false
      run_owner_settings_flow:
        description: "Run the isolated owner settings and public trial-schedule persistence journey"
        required: false
        type: boolean
        default: false
      run_functional_staging:
        description: "Run the complete isolated staging journey suite"
        required: false
        type: boolean
        default: false
      staging_journeys:
        description: "Comma-separated registered staging journey IDs; use all for every journey enabled by the workflow switches"
        required: false
        type: string
        default: "all"

permissions:
  contents: read

env:
  PNPM_VERSION: 11.20.0
  NODE_VERSION: 22

jobs:
  static:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck web and Convex
        run: |
          pnpm typecheck
          pnpm convex:typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and component tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  browser:
    name: Playwright preview journeys
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run Playwright
        # Keep the parent Playwright process and the Next dev server on the
        # same deterministic preview contract. The webServer config repeats
        # these values for the child process; exporting them here also makes
        # Next's public env replacement unambiguous on GitHub-hosted runners.
        env:
          NEXT_PUBLIC_RIVET_DEMO_AUTH: "1"
          NEXT_PUBLIC_DATA_MODE: "mock"
        run: pnpm test:e2e

  convex-codegen:
    name: Convex generated code check (credential-gated)
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate and verify Convex types
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        run: pnpm convex:codegen
      - name: Ensure generated files are committed
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        run: git diff --exit-code -- apps/web/convex/_generated
      - name: Report credential-gated skip
        if: ${{ env.CONVEX_DEPLOY_KEY == '' }}
        run: echo "::notice::Convex code generation was skipped because CONVEX_DEPLOY_KEY is not configured for this repository."

  convex-clerk-smoke:
    name: Authenticated Clerk → Convex smoke
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      PLAYWRIGHT_CLERK_STORAGE_STATE_SECRET: ${{ secrets.PLAYWRIGHT_CLERK_STORAGE_STATE }}
      PLAYWRIGHT_CLERK_STORAGE_OWNER_SECRET: ${{ secrets.PLAYWRIGHT_CLERK_STORAGE_OWNER }}
      PLAYWRIGHT_CLERK_STORAGE_MANAGER_SECRET: ${{ secrets.PLAYWRIGHT_CLERK_STORAGE_MANAGER }}
      PLAYWRIGHT_CLERK_STORAGE_SALESPERSON_SECRET: ${{ secrets.PLAYWRIGHT_CLERK_STORAGE_SALESPERSON }}
      PLAYWRIGHT_CLERK_STORAGE_RECEPTIONIST_SECRET: ${{ secrets.PLAYWRIGHT_CLERK_STORAGE_RECEPTIONIST }}
      PLAYWRIGHT_CLERK_STORAGE_TRAINER_SECRET: ${{ secrets.PLAYWRIGHT_CLERK_STORAGE_TRAINER }}
      PLAYWRIGHT_CLERK_STORAGE_MEMBER_SECRET: ${{ secrets.PLAYWRIGHT_CLERK_STORAGE_MEMBER }}
      PLAYWRIGHT_CLERK_STORAGE_PLATFORM_ADMIN_SECRET: ${{ secrets.PLAYWRIGHT_CLERK_STORAGE_PLATFORM_ADMIN }}
      PLAYWRIGHT_CLERK_STORAGE_FOREIGN_TENANT_SECRET: ${{ secrets.PLAYWRIGHT_CLERK_STORAGE_FOREIGN_TENANT }}
      PLAYWRIGHT_STAGING_STAFF_EMAIL_TEMPLATE_SECRET: ${{ secrets.PLAYWRIGHT_STAGING_STAFF_EMAIL_TEMPLATE }}
      PLAYWRIGHT_STAGING_PT_TRAINER_NAME_SECRET: ${{ secrets.PLAYWRIGHT_STAGING_PT_TRAINER_NAME }}
      PLAYWRIGHT_PRODUCTION_CONVEX_URL: ${{ secrets.PRODUCTION_CONVEX_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Verify trusted smoke credentials
        run: |
          test -n "$CONVEX_DEPLOY_KEY" || { echo "::error::Missing CONVEX_DEPLOY_KEY"; exit 1; }
          test -n "$NEXT_PUBLIC_CONVEX_URL" || { echo "::error::Missing NEXT_PUBLIC_CONVEX_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" || { echo "::error::Missing NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"; exit 1; }
          test -n "$CLERK_SECRET_KEY" || { echo "::error::Missing CLERK_SECRET_KEY"; exit 1; }
          test -n "$PLAYWRIGHT_CLERK_STORAGE_STATE_SECRET" || { echo "::error::Missing PLAYWRIGHT_CLERK_STORAGE_STATE"; exit 1; }
      - name: Write trusted storage state outside the repository
        run: printf '%s' "$PLAYWRIGHT_CLERK_STORAGE_STATE_SECRET" > "$RUNNER_TEMP/clerk-storage-state.json"
      - name: Check optional functional staging credentials
        id: functional_staging_credentials
        if: ${{ inputs.run_functional_staging == true }}
        run: |
          missing=()
          [ -n "${PLAYWRIGHT_CLERK_STORAGE_OWNER_SECRET:-$PLAYWRIGHT_CLERK_STORAGE_STATE_SECRET}" ] || missing+=(owner)
          [ -n "$PLAYWRIGHT_CLERK_STORAGE_MANAGER_SECRET" ] || missing+=(manager)
          [ -n "$PLAYWRIGHT_CLERK_STORAGE_SALESPERSON_SECRET" ] || missing+=(salesperson)
          [ -n "$PLAYWRIGHT_CLERK_STORAGE_RECEPTIONIST_SECRET" ] || missing+=(receptionist)
          [ -n "$PLAYWRIGHT_CLERK_STORAGE_TRAINER_SECRET" ] || missing+=(trainer)
          [ -n "$PLAYWRIGHT_CLERK_STORAGE_MEMBER_SECRET" ] || missing+=(member)
          [ -n "$PLAYWRIGHT_CLERK_STORAGE_PLATFORM_ADMIN_SECRET" ] || missing+=(platform-admin)
          [ -n "$PLAYWRIGHT_CLERK_STORAGE_FOREIGN_TENANT_SECRET" ] || missing+=(foreign-tenant)
          [ -n "$PLAYWRIGHT_STAGING_STAFF_EMAIL_TEMPLATE_SECRET" ] || missing+=(staff-email-template)
          [ -n "$PLAYWRIGHT_STAGING_PT_TRAINER_NAME_SECRET" ] || missing+=(pt-trainer)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Functional staging journeys are credential-blocked; missing configured identities or safe staging values: ${missing[*]}. No functional staging writes will run."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Align isolated staging Convex functions
        if: ${{ inputs.run_operational_flow == true || inputs.run_realtime_flow == true || inputs.run_owner_settings_flow == true || (inputs.run_functional_staging == true && steps.functional_staging_credentials.outputs.ready == 'true') }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
        run: |
          staging_dry_run="$RUNNER_TEMP/convex-staging-dry-run.txt"
          pnpm convex:deploy -- --dry-run --typecheck enable --codegen enable > "$staging_dry_run" 2>&1
          expected_staging_url="${NEXT_PUBLIC_CONVEX_URL%/}"
          grep -Fq "$expected_staging_url" "$staging_dry_run" || { echo "::error::Convex dry run target did not match the configured isolated staging URL."; exit 1; }
          pnpm convex:deploy -- --typecheck enable --codegen enable --message "Isolated staging ${GITHUB_SHA}"
      - name: Run authenticated smoke
        env:
          PLAYWRIGHT_CONVEX_SMOKE: "1"
          PLAYWRIGHT_CLERK_STORAGE_STATE: ${{ runner.temp }}/clerk-storage-state.json
        run: pnpm --filter web exec playwright test e2e/convex-smoke.spec.ts
      - name: Run staged operational flow
        if: ${{ inputs.run_operational_flow == true }}
        env:
          PLAYWRIGHT_CONVEX_SMOKE: "1"
          PLAYWRIGHT_CONVEX_OPERATIONAL_FLOW: "1"
          PLAYWRIGHT_TARGET_CLASSIFICATION: staging
          PLAYWRIGHT_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_EXPECTED_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          PLAYWRIGHT_PRODUCTION_CONVEX_URL: ${{ secrets.PRODUCTION_CONVEX_URL }}
          PLAYWRIGHT_STAGING_JOURNEYS: ${{ inputs.staging_journeys == 'all' && 'membership-lifecycle' || inputs.staging_journeys }}
          PLAYWRIGHT_CLERK_STORAGE_STATE: ${{ runner.temp }}/clerk-storage-state.json
        run: pnpm --filter web exec playwright test e2e/convex-operational-flow.spec.ts
      - name: Run staged two-browser realtime flow
        if: ${{ inputs.run_realtime_flow == true }}
        env:
          PLAYWRIGHT_CONVEX_SMOKE: "1"
          PLAYWRIGHT_CONVEX_REALTIME: "1"
          PLAYWRIGHT_TARGET_CLASSIFICATION: staging
          PLAYWRIGHT_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_EXPECTED_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          PLAYWRIGHT_PRODUCTION_CONVEX_URL: ${{ secrets.PRODUCTION_CONVEX_URL }}
          PLAYWRIGHT_STAGING_JOURNEYS: ${{ inputs.staging_journeys == 'all' && 'realtime-smoke' || inputs.staging_journeys }}
          PLAYWRIGHT_CLERK_STORAGE_OWNER: ${{ runner.temp }}/clerk-storage-state.json
          PLAYWRIGHT_CLERK_STORAGE_STATE: ${{ runner.temp }}/clerk-storage-state.json
        run: pnpm --filter web exec playwright test e2e/convex-realtime-two-browser.spec.ts
      - name: Run staged owner settings and trial schedule flow
        if: ${{ inputs.run_owner_settings_flow == true }}
        env:
          PLAYWRIGHT_STAGING_FULL_SUITE: "1"
          PLAYWRIGHT_TARGET_CLASSIFICATION: staging
          PLAYWRIGHT_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_EXPECTED_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          PLAYWRIGHT_PRODUCTION_CONVEX_URL: ${{ secrets.PRODUCTION_CONVEX_URL }}
          PLAYWRIGHT_STAGING_JOURNEYS: ${{ inputs.staging_journeys == 'all' && 'owner-settings' || inputs.staging_journeys }}
          PLAYWRIGHT_CLERK_STORAGE_OWNER: ${{ runner.temp }}/clerk-storage-state.json
        run: pnpm --filter web exec playwright test e2e/staging-owner-settings.spec.ts
      - name: Report functional staging journey status
        if: ${{ inputs.run_functional_staging == true }}
        run: |
          echo "::notice::Implemented: membership-lifecycle, owner-settings, realtime-smoke"
          echo "::notice::Credential-blocked: provisioning, staff-authorization, trial-crm, reception-entry, finance-reconciliation, member-portal, isolation-audit, personal-training"
          echo "::notice::Deferred: automation (the product page is intentionally Coming soon)"
          if [ "${{ inputs.staging_journeys }}" = "all" ]; then
            echo "::notice::Not run: none; the deferred journey and credential-blocked journeys are reported and skipped before functional staging writes when their prerequisites are unavailable."
          else
            echo "::notice::Not run: registered journey IDs excluded by the '${{ inputs.staging_journeys }}' selector."
          fi
      - name: Write role-specific functional staging states outside the repository
        if: ${{ inputs.run_functional_staging == true && steps.functional_staging_credentials.outputs.ready == 'true' }}
        run: |
          printf '%s' "${PLAYWRIGHT_CLERK_STORAGE_OWNER_SECRET:-$PLAYWRIGHT_CLERK_STORAGE_STATE_SECRET}" > "$RUNNER_TEMP/clerk-owner.json"
          printf '%s' "$PLAYWRIGHT_CLERK_STORAGE_MANAGER_SECRET" > "$RUNNER_TEMP/clerk-manager.json"
          printf '%s' "$PLAYWRIGHT_CLERK_STORAGE_SALESPERSON_SECRET" > "$RUNNER_TEMP/clerk-salesperson.json"
          printf '%s' "$PLAYWRIGHT_CLERK_STORAGE_RECEPTIONIST_SECRET" > "$RUNNER_TEMP/clerk-receptionist.json"
          printf '%s' "$PLAYWRIGHT_CLERK_STORAGE_TRAINER_SECRET" > "$RUNNER_TEMP/clerk-trainer.json"
          printf '%s' "$PLAYWRIGHT_CLERK_STORAGE_MEMBER_SECRET" > "$RUNNER_TEMP/clerk-member.json"
          printf '%s' "$PLAYWRIGHT_CLERK_STORAGE_PLATFORM_ADMIN_SECRET" > "$RUNNER_TEMP/clerk-platform_admin.json"
          printf '%s' "$PLAYWRIGHT_CLERK_STORAGE_FOREIGN_TENANT_SECRET" > "$RUNNER_TEMP/clerk-foreign_tenant.json"
      - name: Run functional staging journeys
        if: ${{ inputs.run_functional_staging == true && steps.functional_staging_credentials.outputs.ready == 'true' }}
        env:
          PLAYWRIGHT_STAGING_FULL_SUITE: "1"
          PLAYWRIGHT_TARGET_CLASSIFICATION: staging
          PLAYWRIGHT_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          PLAYWRIGHT_EXPECTED_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          PLAYWRIGHT_PRODUCTION_CONVEX_URL: ${{ secrets.PRODUCTION_CONVEX_URL }}
          PLAYWRIGHT_STAGING_JOURNEYS: ${{ inputs.staging_journeys }}
          PLAYWRIGHT_CLERK_STORAGE_OWNER: ${{ runner.temp }}/clerk-owner.json
          PLAYWRIGHT_CLERK_STORAGE_MANAGER: ${{ runner.temp }}/clerk-manager.json
          PLAYWRIGHT_CLERK_STORAGE_SALESPERSON: ${{ runner.temp }}/clerk-salesperson.json
          PLAYWRIGHT_CLERK_STORAGE_RECEPTIONIST: ${{ runner.temp }}/clerk-receptionist.json
          PLAYWRIGHT_CLERK_STORAGE_TRAINER: ${{ runner.temp }}/clerk-trainer.json
          PLAYWRIGHT_CLERK_STORAGE_MEMBER: ${{ runner.temp }}/clerk-member.json
          PLAYWRIGHT_CLERK_STORAGE_PLATFORM_ADMIN: ${{ runner.temp }}/clerk-platform_admin.json
          PLAYWRIGHT_CLERK_STORAGE_FOREIGN_TENANT: ${{ runner.temp }}/clerk-foreign_tenant.json
          PLAYWRIGHT_STAGING_STAFF_EMAIL_TEMPLATE: ${{ secrets.PLAYWRIGHT_STAGING_STAFF_EMAIL_TEMPLATE }}
          PLAYWRIGHT_STAGING_PT_TRAINER_NAME: ${{ secrets.PLAYWRIGHT_STAGING_PT_TRAINER_NAME }}
        run: pnpm --filter web exec playwright test e2e/staging-provisioning.spec.ts e2e/staging-staff-authorization.spec.ts e2e/staging-trial-crm.spec.ts e2e/staging-reception-entry.spec.ts e2e/staging-automation.spec.ts e2e/staging-member-portal.spec.ts e2e/staging-isolation-audit.spec.ts e2e/staging-personal-training.spec.ts e2e/staging-finance-reconciliation.spec.ts
